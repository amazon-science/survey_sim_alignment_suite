[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personagen"
version = "0.1.0"
description = "Data-driven persona generation and survey simulation pipeline"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.28",
    "datasets>=2.14",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.setuptools.packages.find]
include = ["radius*", "personagen*"]
